<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Data Entry System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section class="login-page" id="loginPage">
    <div class="login-card">
      <h1>Retail Manager Login</h1>
      <p>Enter your demo credentials to continue</p>

      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />

      <button onclick="login()">Login</button>
      <p class="error" id="loginError"></p>

      <small>Demo: admin / 12345</small>
    </div>
  </section>

  <section class="dashboard hidden" id="dashboardPage">
    <div class="top-bar">
      <div>
        <h2>Retail Data Entry</h2>
        <p>Daily customer movement and purchase tracking</p>
      </div>

      <div class="clock-box">
        <span>Live Time</span>
        <strong id="liveClock">00:00:00</strong>
      </div>
    </div>

    <div class="form-card">
      <form id="entryForm">

        <div class="form-grid">
          <div class="input-group">
            <label>Branch / Outlet Name</label>
            <input type="text" id="shopName" placeholder="Example: Mirpur Branch" required />
          </div>

          <div class="input-group">
            <label>Purchase Status</label>
            <select id="purchase" required>
              <option value="">Select purchase status</option>
              <option>Purchased</option>
              <option>Not Purchased</option>
            </select>
          </div>

          <div class="input-group">
            <label>Data Entry Date & Time</label>
            <input type="datetime-local" id="timestamp" required />
          </div>

          <div class="input-group">
            <label>Current Weather Condition</label>
            <select id="weather" required>
              <option value="">Select weather condition</option>
              <option>Hot</option>
              <option>Rainy</option>
              <option>Cloudy</option>
              <option>Cold</option>
              <option>Normal</option>
            </select>

            <button type="button" class="add-weather-btn" onclick="openModal()">
              + Add Weather Condition
            </button>
          </div>

          <div class="input-group">
            <label>Customer Feedback / Visit Reason</label>
            <select id="customerLog" required>
              <option value="">Select customer log</option>
              <option>Size Not Available</option>
              <option>Price Too High</option>
              <option>Product Not Preferred</option>
              <option>Just Visiting</option>
              <option>Purchased Successfully</option>
            </select>
          </div>

          <div class="input-group">
            <label>Total Footfall</label>
            <input type="number" id="totalFootfall" placeholder="Total visitors entered shop" required />
          </div>

          <div class="input-group">
            <label>Total Customers Served</label>
            <input type="number" id="customerCount" placeholder="Number of customers served" required />
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit Retail Data</button>
      </form>

      <div class="success hidden" id="successMsg">
        Data submitted successfully!
      </div>

      <div id="output" class="output-box hidden"></div>

      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </section>

  <div class="modal hidden" id="weatherModal">
    <div class="modal-content">
      <h3>Add New Weather Condition</h3>
      <input type="text" id="newWeather" placeholder="Example: Humid" />

      <div class="modal-actions">
        <button onclick="addWeather()">Add</button>
        <button class="cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
